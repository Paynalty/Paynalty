spring:
  application:
    name: paynalty

  # 활성 프로파일 (dev/prod)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA 공통 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        use_sql_comments: true

  # Jackson 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

# 서버 설정
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# JWT 설정
jwt:
  secret: ${JWT_SECRET:paynalty-secret-key-for-development-only-change-in-production}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000} # 1시간 (ms)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:604800000} # 7일 (ms)

# Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Logging 설정
logging:
  level:
    root: INFO
    com.paynalty: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 토스 앱인토스 API 설정
toss:
  api:
    base-url: ${TOSS_API_BASE_URL:https://apps-in-toss-api.toss.im}

    # mTLS 인증서 경로 (resources/certs 폴더 기준)
    mtls:
      client-cert-path: ${TOSS_CLIENT_CERT_PATH:src/main/resources/certs/test-mTLS_public.crt}
      client-key-path: ${TOSS_CLIENT_KEY_PATH:src/main/resources/certs/test-mTLS_private.key}
      # 인증서 비밀번호 (있는 경우만)
      key-password: ${TOSS_KEY_PASSWORD:}
