spring:
  # MySQL 데이터베이스 설정 (운영 환경)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:paynalty}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정 (운영)
  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 스키마 변경 금지
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

# 서버 설정 (운영)
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# JWT 설정 (운영)
jwt:
  secret: ${JWT_SECRET}  # 반드시 환경변수로 주입
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:604800000}

# Logging 설정 (운영)
logging:
  level:
    root: INFO
    com.paynalty: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/paynalty/application.log
    max-size: 10MB
    max-history: 30

# Swagger 설정 (운영 - 비활성화)
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Toss 설정
toss:
  api:
    api-key: ${TOSS_API_KEY}
    data-secret-key: ${TOSS_DATA_SECRET_KEY}
    referrer: "DEFAULT"