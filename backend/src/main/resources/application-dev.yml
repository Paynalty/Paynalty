spring:
  # H2 데이터베이스 설정 (개발 환경)
  datasource:
    url: jdbc:h2:mem:paynalty
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 활성 프로파일 (민감 정보- API, 복호화 키)
  profiles:
    include: local

  # H2 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정 (개발)
  jpa:
    hibernate:
      ddl-auto: create-drop  # 애플리케이션 시작 시 테이블 생성, 종료 시 삭제
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

# Logging 설정 (개발)
logging:
  level:
    root: INFO
    com.paynalty: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Swagger 설정 (개발)
springdoc:
  swagger-ui:
    enabled: true